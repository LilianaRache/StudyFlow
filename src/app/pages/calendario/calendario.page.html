<ion-header>
  <ion-toolbar>
    <ion-title>Calendario</ion-title>
  </ion-toolbar>
</ion-header>

<div class="bottom-nav">
  <a routerLink="/dashboard">Inicio</a>
  <a routerLink="/materias">Materias</a>
  <a routerLink="/tareas">Tareas</a>
  <a routerLink="/calendario">Calendario</a>
  <a routerLink="/estadisticas">Stats</a>
</div>

<ion-content class="ion-padding">

  <h2 class="section-title">Calendario Académico</h2>

  <div class="study-card">
    <h3>Entregas registradas</h3>

    <p class="muted" *ngIf="tareas.length === 0">
      No hay tareas con fecha registrada.
    </p>

    <div *ngFor="let tarea of tareas">
      <p>
        <strong>{{ formatearFecha(tarea.fecha) }}:</strong>
        {{ tarea.titulo }} - {{ tarea.materia }}
      </p>
    </div>
  </div>

</ion-content>
