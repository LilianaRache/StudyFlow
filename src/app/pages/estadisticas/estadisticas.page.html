<ion-header>
  <ion-toolbar>
    <ion-title>Estadísticas</ion-title>
  </ion-toolbar>
</ion-header>

<div class="bottom-nav">
  <a routerLink="/dashboard" routerLinkActive="active">
    <span>🏠</span>
    Inicio
  </a>

  <a routerLink="/materias" routerLinkActive="active">
    <span>📚</span>
    Materias
  </a>

  <a routerLink="/tareas" routerLinkActive="active">
    <span>✅</span>
    Tareas
  </a>

  <a routerLink="/calendario" routerLinkActive="active">
    <span>📅</span>
    Calendario
  </a>

  <a routerLink="/configuracion" routerLinkActive="active">
    <span>👤</span>
    Perfil
  </a>
</div>

<ion-content class="ion-padding">

  <div class="study-card">
    <h3>Tareas por estado</h3>
    <canvas id="barChart"></canvas>
  </div>

  <div class="study-card">
    <h3>Distribución por materia</h3>
    <canvas id="pieChart"></canvas>
  </div>

  <div class="study-card">
    <h3>Progreso general</h3>
    <ion-progress-bar [value]="progreso"></ion-progress-bar>
    <p class="muted">{{ progreso * 100 | number:'1.0-0' }}% completado</p>
  </div>

</ion-content>
